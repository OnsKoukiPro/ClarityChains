# ==========================================
# docker-compose.yml (ROOT DIRECTORY)
# ==========================================
version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: claritychain_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      - POSTGRES_DB=claritychain
      - POSTGRES_USER=claritychain_user
      - POSTGRES_PASSWORD=secure_password_change_me
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claritychain_user -d claritychain"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - claritychain_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: claritychain_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - claritychain_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # AI Agent Service (FastAPI)
  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: claritychain_agent
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --workers 2
    volumes:
      - ./agent:/app
      - agent_temp:/tmp/agent_files
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ENVIRONMENT=production
      - BACKEND_URL=http://backend:8000
      - AZURE_OPENAI_ENDPOINT=https://claritychainprod.openai.azure.com/
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY}
      - AZURE_OPENAI_API_VERSION=2024-12-01-preview
      - AZURE_OPENAI_DEPLOYMENT_NAME=ClarityChain
      - AZURE_OPENAI_MODEL_NAME=gpt-4o
      - USE_RETRIEVER=true
      - AZURE_OPENAI_EMBEDDING_DEPLOYMENT=text-embedding-ada-002
    ports:
      - "8001:8001"
    networks:
      - claritychain_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Django Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: claritychain_backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120"
    volumes:
      - ./backend:/app
      - media_files:/app/media
      - static_files:/app/staticfiles
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-your-default-secret-key-change-in-production}
      - DATABASE_URL=postgresql://claritychain_user:secure_password_change_me@db:5432/claritychain
      - AGENT_API_URL=http://agent:8001
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_HOSTS=localhost,backend,nginx,127.0.0.1,0.0.0.0
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:80,http://localhost,http://frontend:80
      - CORS_ALLOW_ALL_ORIGINS=True  # For development
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - claritychain_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]  # Fixed health check URL
      interval: 30s
      timeout: 10s
      retries: 3

  # React Frontend (Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:8000
        - VITE_AGENT_BASE_URL=http://localhost:8001
    container_name: claritychain_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
      - agent
    networks:
      - claritychain_network
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
      - VITE_AGENT_BASE_URL=http://localhost:8001

  # Nginx Reverse Proxy
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: claritychain_nginx
    volumes:
      - static_files:/static
      - media_files:/media
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
      - agent
    networks:
      - claritychain_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  media_files:
  static_files:
  agent_temp:

networks:
  claritychain_network:
    driver: bridge